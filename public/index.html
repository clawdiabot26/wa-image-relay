<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📎 WA File Relay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; }

  /* Auth screen */
  .auth-screen {
    width: 100%;
    max-width: 400px;
    margin-top: 60px;
    text-align: center;
  }
  .auth-screen .lock-icon { font-size: 4rem; margin-bottom: 16px; }
  .auth-screen h2 { font-size: 1.3rem; margin-bottom: 8px; }
  .auth-screen p { color: #888; font-size: 0.9rem; margin-bottom: 24px; }
  .auth-input {
    width: 100%;
    padding: 14px 16px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    color: #e0e0e0;
    font-size: 1rem;
    margin-bottom: 12px;
    outline: none;
    text-align: center;
    letter-spacing: 2px;
  }
  .auth-input:focus { border-color: #25D366; }
  .auth-btn {
    width: 100%;
    padding: 14px;
    background: #25D366;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 12px;
  }
  .auth-btn:hover { background: #1da851; }
  .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .auth-error {
    color: #f44;
    font-size: 0.85rem;
    margin-top: 8px;
    min-height: 20px;
  }
  .logout-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    background: transparent;
    border: 1px solid #333;
    color: #888;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .logout-btn:hover { border-color: #f44; color: #f44; }

  /* Status */
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    padding: 10px 20px;
    border-radius: 12px;
    background: #1a1a1a;
    border: 1px solid #333;
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #f44;
  }
  .status-dot.connected { background: #4f4; }

  /* QR Code */
  #qr-container {
    background: white;
    padding: 16px;
    border-radius: 16px;
    margin-bottom: 24px;
  }
  #qr-container img { display: block; width: 280px; height: 280px; }

  /* Upload area */
  .upload-area {
    width: 100%;
    max-width: 500px;
    border: 2px dashed #444;
    border-radius: 16px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    margin-bottom: 16px;
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: #25D366;
    background: rgba(37, 211, 102, 0.05);
  }
  .upload-area.disabled {
    opacity: 0.3;
    pointer-events: none;
  }
  .upload-icon { font-size: 3rem; margin-bottom: 12px; }
  .upload-text { color: #aaa; font-size: 0.9rem; }
  input[type="file"] { display: none; }

  /* Caption */
  .caption-input {
    width: 100%;
    max-width: 500px;
    padding: 12px 16px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    color: #e0e0e0;
    font-size: 0.9rem;
    margin-bottom: 16px;
    outline: none;
  }
  .caption-input:focus { border-color: #25D366; }

  /* Preview */
  .preview {
    width: 100%;
    max-width: 500px;
    margin-bottom: 16px;
    display: none;
  }
  .preview img, .preview video {
    width: 100%;
    border-radius: 12px;
    max-height: 400px;
    object-fit: contain;
    background: #111;
  }
  .preview .file-name {
    padding: 12px;
    background: #1a1a1a;
    border-radius: 12px;
    text-align: center;
    color: #aaa;
  }

  /* Button */
  .send-btn {
    width: 100%;
    max-width: 500px;
    padding: 14px;
    background: #25D366;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
  }
  .send-btn:hover { background: #1da851; }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 100;
  }
  .toast.success { background: #25D366; color: white; }
  .toast.error { background: #f44; color: white; }
  .toast.show { opacity: 1; }

  /* History */
  .history {
    width: 100%;
    max-width: 500px;
    margin-top: 24px;
  }
  .history h3 { font-size: 0.85rem; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: #1a1a1a;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .history-item img {
    width: 48px; height: 48px;
    border-radius: 8px;
    object-fit: cover;
  }
  .history-item .info { flex: 1; }
  .history-item .info .name { font-size: 0.85rem; }
  .history-item .info .time { font-size: 0.75rem; color: #666; }
  .history-item .check { color: #25D366; font-size: 1.2rem; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- AUTH: Setup / Login -->
<div id="authScreen" class="auth-screen hidden">
  <!-- Setup (first time) -->
  <div id="setupView" class="hidden">
    <div class="lock-icon">🔐</div>
    <h2>Definir Senha</h2>
    <p>Primeira vez? Crie uma senha para proteger o acesso.</p>
    <input type="password" class="auth-input" id="setupPass" placeholder="Nova senha" autofocus>
    <input type="password" class="auth-input" id="setupPassConfirm" placeholder="Confirmar senha">
    <button class="auth-btn" id="setupBtn">Definir Senha</button>
    <div class="auth-error" id="setupError"></div>
  </div>

  <!-- Login -->
  <div id="loginView" class="hidden">
    <div class="lock-icon">🔒</div>
    <h2>WA File Relay</h2>
    <p>Digite a senha para acessar</p>
    <input type="password" class="auth-input" id="loginPass" placeholder="Senha" autofocus>
    <button class="auth-btn" id="loginBtn">Entrar</button>
    <div class="auth-error" id="loginError"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">
  <button class="logout-btn" id="logoutBtn">Sair</button>

  <h1>📎 WA File Relay</h1>
  <p class="subtitle">Upload de qualquer arquivo → direto pro seu WhatsApp</p>

  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Verificando...</span>
  </div>

  <div id="qr-container" style="display:none">
    <img id="qrImg" src="" alt="QR Code">
  </div>

  <div class="upload-area disabled" id="uploadArea">
    <div class="upload-icon">📎</div>
    <div class="upload-text">Arraste, clique ou cole (Ctrl+V) qualquer arquivo</div>
    <input type="file" id="fileInput">
  </div>

  <input type="text" class="caption-input" id="captionInput" placeholder="Legenda (opcional)">

  <div class="preview" id="preview"></div>

  <button class="send-btn" id="sendBtn">📤 Enviar pro WhatsApp</button>

  <div class="history" id="history" style="display:none">
    <h3>Enviados</h3>
    <div id="historyList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── Auth state ─────────────────────────────────────
let sessionToken = localStorage.getItem('wa_relay_token')

function authHeaders() {
  return sessionToken ? { 'X-Session-Token': sessionToken } : {}
}

async function checkAuth() {
  try {
    const res = await fetch('/api/auth/status', { headers: authHeaders() })
    const data = await res.json()

    if (!data.hasPassword) {
      showScreen('setup')
    } else if (!data.authenticated) {
      showScreen('login')
    } else {
      showScreen('app')
    }
  } catch {
    showScreen('login')
  }
}

function showScreen(screen) {
  document.getElementById('authScreen').classList.toggle('hidden', screen === 'app')
  document.getElementById('setupView').classList.toggle('hidden', screen !== 'setup')
  document.getElementById('loginView').classList.toggle('hidden', screen !== 'login')
  document.getElementById('mainApp').classList.toggle('hidden', screen !== 'app')

  if (screen === 'setup') document.getElementById('setupPass').focus()
  if (screen === 'login') document.getElementById('loginPass').focus()
}

// Setup password
document.getElementById('setupBtn').addEventListener('click', async () => {
  const pass = document.getElementById('setupPass').value
  const confirm = document.getElementById('setupPassConfirm').value
  const err = document.getElementById('setupError')

  if (pass.length < 4) { err.textContent = 'Mínimo 4 caracteres'; return }
  if (pass !== confirm) { err.textContent = 'Senhas não coincidem'; return }

  const res = await fetch('/api/auth/setup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pass })
  })
  const data = await res.json()
  if (data.token) {
    sessionToken = data.token
    localStorage.setItem('wa_relay_token', sessionToken)
    showScreen('app')
    startApp()
  } else {
    err.textContent = data.error || 'Erro'
  }
})

// Login
document.getElementById('loginBtn').addEventListener('click', doLogin)
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin() })
document.getElementById('setupPassConfirm').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('setupBtn').click() })

async function doLogin() {
  const pass = document.getElementById('loginPass').value
  const err = document.getElementById('loginError')

  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pass })
  })
  const data = await res.json()
  if (data.token) {
    sessionToken = data.token
    localStorage.setItem('wa_relay_token', sessionToken)
    showScreen('app')
    startApp()
  } else {
    err.textContent = data.error || 'Senha incorreta'
    document.getElementById('loginPass').value = ''
    document.getElementById('loginPass').focus()
  }
}

// Logout
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST', headers: authHeaders() })
  sessionToken = null
  localStorage.removeItem('wa_relay_token')
  showScreen('login')
})

// ─── Main App ───────────────────────────────────────
const uploadArea = document.getElementById('uploadArea')
const fileInput = document.getElementById('fileInput')
const preview = document.getElementById('preview')
const sendBtn = document.getElementById('sendBtn')
const captionInput = document.getElementById('captionInput')
const statusDot = document.getElementById('statusDot')
const statusText = document.getElementById('statusText')
const qrContainer = document.getElementById('qr-container')
const qrImg = document.getElementById('qrImg')
const historyDiv = document.getElementById('history')
const historyList = document.getElementById('historyList')

let selectedFile = null
let connected = false
let statusInterval = null

function startApp() {
  if (statusInterval) clearInterval(statusInterval)
  statusInterval = setInterval(checkWAStatus, 2000)
  checkWAStatus()
}

async function checkWAStatus() {
  try {
    const res = await fetch('/api/status', { headers: authHeaders() })
    if (res.status === 401) { showScreen('login'); return }
    const data = await res.json()
    connected = data.connected

    statusDot.className = `status-dot ${connected ? 'connected' : ''}`
    statusText.textContent = connected
      ? `Conectado: ${data.jid?.split('@')[0] || '?'}`
      : 'Aguardando conexão...'

    uploadArea.classList.toggle('disabled', !connected)

    if (!connected && data.qr) {
      qrContainer.style.display = 'block'
      qrImg.src = data.qr
    } else {
      qrContainer.style.display = 'none'
    }
  } catch (e) {
    statusText.textContent = 'Servidor offline'
  }
}

// Upload area
uploadArea.addEventListener('click', () => fileInput.click())
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover') })
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'))
uploadArea.addEventListener('drop', e => {
  e.preventDefault()
  uploadArea.classList.remove('dragover')
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0])
})
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]) })

document.addEventListener('paste', e => {
  if (!connected) return
  const items = e.clipboardData?.items
  if (!items) return
  for (const item of items) {
    if (item.kind === 'file') {
      e.preventDefault()
      handleFile(item.getAsFile())
      return
    }
  }
})

function getFileIcon(type, name) {
  if (type.startsWith('image/')) return '🖼️'
  if (type.startsWith('video/')) return '🎬'
  if (type.startsWith('audio/')) return '🎵'
  if (type === 'application/pdf') return '📕'
  if (type.includes('zip') || type.includes('rar')) return '📦'
  if (type.includes('word') || name?.endsWith('.docx')) return '📝'
  if (type.includes('sheet') || name?.endsWith('.xlsx')) return '📊'
  return '📄'
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B'
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB'
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB'
}

function handleFile(file) {
  selectedFile = file
  preview.style.display = 'block'
  sendBtn.style.display = 'block'

  if (file.type.startsWith('image/')) {
    preview.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="preview">`
  } else if (file.type.startsWith('video/')) {
    preview.innerHTML = `<video src="${URL.createObjectURL(file)}" controls></video>`
  } else if (file.type.startsWith('audio/')) {
    preview.innerHTML = `<div class="file-name">${getFileIcon(file.type, file.name)} ${file.name}<br><small style="color:#666">${formatSize(file.size)}</small><br><audio src="${URL.createObjectURL(file)}" controls style="margin-top:8px;width:100%"></audio></div>`
  } else {
    preview.innerHTML = `<div class="file-name">${getFileIcon(file.type, file.name)} ${file.name}<br><small style="color:#666">${formatSize(file.size)}</small></div>`
  }
}

sendBtn.addEventListener('click', async () => {
  if (!selectedFile || !connected) return

  sendBtn.disabled = true
  sendBtn.textContent = '⏳ Enviando...'

  const form = new FormData()
  form.append('file', selectedFile)
  form.append('caption', captionInput.value)

  try {
    const res = await fetch('/api/send', {
      method: 'POST',
      headers: authHeaders(),
      body: form
    })
    if (res.status === 401) { showScreen('login'); return }
    const data = await res.json()

    if (data.success) {
      showToast('✅ Enviado!', 'success')
      addHistory(selectedFile)
      selectedFile = null
      preview.style.display = 'none'
      sendBtn.style.display = 'none'
      captionInput.value = ''
      fileInput.value = ''
    } else {
      showToast(`❌ ${data.error}`, 'error')
    }
  } catch (e) {
    showToast(`❌ ${e.message}`, 'error')
  }

  sendBtn.disabled = false
  sendBtn.textContent = '📤 Enviar pro WhatsApp'
})

function addHistory(file) {
  historyDiv.style.display = 'block'
  const item = document.createElement('div')
  item.className = 'history-item'

  const thumb = file.type.startsWith('image/')
    ? `<img src="${URL.createObjectURL(file)}" alt="">`
    : `<div style="width:48px;height:48px;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5rem">${getFileIcon(file.type, file.name)}</div>`

  item.innerHTML = `
    ${thumb}
    <div class="info">
      <div class="name">${file.name}</div>
      <div class="time">${new Date().toLocaleTimeString('pt-BR')}</div>
    </div>
    <div class="check">✓</div>
  `
  historyList.prepend(item)
}

function showToast(msg, type) {
  const toast = document.getElementById('toast')
  toast.textContent = msg
  toast.className = `toast ${type} show`
  setTimeout(() => toast.classList.remove('show'), 3000)
}

// ─── Init ───────────────────────────────────────────
checkAuth()
</script>
</body>
</html>
